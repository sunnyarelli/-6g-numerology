[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "6g-numerology"
version = "0.1.0"
description = "OFDM numerology and frame-structure explorer for NR and 6G"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sunny Arelli"}]
keywords = ["6G", "3GPP", "Release 20", "wireless", "5G-Advanced"]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/sunnyarelli/-6g-numerology"
Issues = "https://github.com/sunnyarelli/-6g-numerology/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
numerology = "numerology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
